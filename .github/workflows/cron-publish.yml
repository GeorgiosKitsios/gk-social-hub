name: Cron – Auto Publish

on:
  schedule:
    # Alle 5 Minuten (GitHub Actions Minimum)
    - cron: '*/5 * * * *'
  # Manuell auslösbar zum Testen
  workflow_dispatch:

jobs:
  publish:
    name: Fällige Posts veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Cron-Route aufrufen
        run: |
          echo "Rufe Cron-Route auf: $(date -u)"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 60 \
            --write-out "\n---HTTP_STATUS:%{http_code}" \
            "https://blueviolet-armadillo-356286.hostingersite.com/api/cron/publish?secret=${{ secrets.CRON_SECRET }}")

          HTTP_STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/^---HTTP_STATUS:/d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FEHLER: Cron-Route gab Status $HTTP_STATUS zurück"
            exit 1
          fi

          echo "Cron-Job erfolgreich abgeschlossen"
