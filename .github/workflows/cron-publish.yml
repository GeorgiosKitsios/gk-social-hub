name: Cron – Auto Publish

on:
  schedule:
    # Alle 5 Minuten (GitHub Actions Minimum)
    - cron: '*/5 * * * *'
  # Manuell auslösbar zum Testen
  workflow_dispatch:

jobs:
  publish:
    name: Fällige Posts veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Fällige Posts veröffentlichen
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: https://blueviolet-armadillo-356286.hostingersite.com/api/cron/publish
        run: |
          set -u

          body_file="$(mktemp)"
          status="$(curl \
            --silent \
            --show-error \
            --retry 0 \
            --max-time 60 \
            --request POST \
            --output "$body_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            --header "Cache-Control: no-cache" \
            --header "User-Agent: Mozilla/5.0" \
            "$CRON_URL" || true)"

          echo "HTTP Status: ${status:-curl-error}"
          echo "Response Body:"
          if [ -s "$body_file" ]; then
            cat "$body_file"
            echo ""
          else
            echo "(leer)"
          fi

          rm -f "$body_file"

          if [ "$status" != "200" ]; then
            echo "FEHLER: Cron-Request war nicht erfolgreich. Erwartet: HTTP 200, erhalten: ${status:-curl-error}."
            exit 1
          fi
